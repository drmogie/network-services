# Small proxy for Home Assistant Ingress.
# Home Assistant sends sidebar requests to port 5381. This passes them to the
# Technitium web page on port 5380. Only the Supervisor may connect.
worker_processes 1;
pid /tmp/nginx-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-ingress/body;
    proxy_temp_path /tmp/nginx-ingress/proxy;
    fastcgi_temp_path /tmp/nginx-ingress/fastcgi;
    uwsgi_temp_path /tmp/nginx-ingress/uwsgi;
    scgi_temp_path /tmp/nginx-ingress/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 5381;
        server_name _;

        # Only the Home Assistant Supervisor may use this port.
        allow 172.30.32.2;
        deny all;

        client_max_body_size 1g;

        location / {
            proxy_pass http://127.0.0.1:5380;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;

            # Technitium blocks being shown inside another page. Home Assistant
            # shows it in a frame from the same address, so allow that only.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }
    }
}
